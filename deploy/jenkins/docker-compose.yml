# Jenkins 실행 정의 — EC2의 /home/ubuntu/jenkins/ 에 배치해 사용한다.
#   cp .env.example .env 후 DOCKER_GID를 채우고: docker compose up -d --build
# Jenkins Home(잡, 플러그인, Credentials)은 호스트 볼륨에 보존된다.
services:
  jenkins:
    build: .
    image: itda-jenkins:lts
    container_name: jenkins
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"        # 외부 접근은 호스트 Nginx의 /jenkins/ 경유

    environment:
      JENKINS_OPTS: "--prefix=/jenkins"
      JAVA_OPTS: "-Duser.timezone=Asia/Seoul"

    group_add:
      - "${DOCKER_GID:?DOCKER_GID is required — .env.example 참고}"

    volumes:
      - /home/ubuntu/jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # 호스트 Docker 사용 (강력 권한 — jenkins.md 참고)
