# ==========================================================================
# 로컬 개발용 Compose — 전체 스택을 소스에서 빌드해 한 번에 띄운다.
#   docker compose up --build --watch
# --watch 필수: Windows에서는 바인드 마운트로 파일 변경 이벤트가 컨테이너에
# 전달되지 않으므로, compose watch(sync)가 변경 파일을 컨테이너 안으로 복사해
# vite/devtools/uvicorn의 자동 반영을 동작시킨다.
# 운영 배포는 deploy/docker-compose.prod.yml + scripts/deploy.sh를 사용한다.
# ==========================================================================
name: itda-dev

services:
  web:
    build:
      context: ./apps/web
      target: build            # 빌더 스테이지에서 멈추고 vite dev 서버 실행
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_PROXY_TARGET: http://backend:8080   # /api 요청을 backend 컨테이너로 프록시
    ports:
      - "127.0.0.1:5173:5173"
    develop:
      watch:
        - action: sync                          # 변경 파일을 컨테이너로 복사 → HMR
          path: ./apps/web/src
          target: /app/src
          initial_sync: true
        - action: sync
          path: ./apps/web/index.html
          target: /app/index.html
          initial_sync: true
        - action: rebuild                       # 의존성 변경은 이미지 재빌드
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/package-lock.json
    depends_on:
      - backend

  backend:
    build:
      context: ./apps/backend
      target: dev              # bootRun + devtools 자동 재시작 (운영 배포는 최종 스테이지)
    environment:
      SPRING_PROFILES_ACTIVE: local            # H2 in-memory — 로컬에 DB 불필요
      AI_BASE_URL: http://ai:8000/api/v1       # AI는 내부 네트워크로 직접 호출
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - gradle-cache:/root/.gradle             # 의존성 캐시 (컨테이너 재생성 시 재다운로드 방지)
    develop:
      watch:
        - action: sync                          # src 복사 → build --continuous 재컴파일 → devtools 재시작
          path: ./apps/backend/src
          target: /workspace/src
          initial_sync: true
        - action: rebuild
          path: ./apps/backend/build.gradle
        - action: rebuild
          path: ./apps/backend/settings.gradle
    depends_on:
      - ai

  ai:
    build:
      context: ./apps/ai
      target: dev              # uvicorn --reload 자동 재시작 (운영 배포는 최종 스테이지)
    environment:
      ITDA_DEBUG: "true"
    ports:
      - "127.0.0.1:8000:8000"                  # 로컬 디버깅 편의용 (운영은 내부 전용)
    develop:
      watch:
        - action: sync                          # app 복사 → uvicorn --reload 재시작
          path: ./apps/ai/app
          target: /srv/app
          initial_sync: true
        - action: rebuild
          path: ./apps/ai/requirements.txt
        - action: rebuild
          path: ./apps/ai/requirements-dev.txt

volumes:
  gradle-cache:
