# ==========================================================================
# 로컬 개발용 Compose — 전체 스택을 소스에서 빌드해 한 번에 띄운다.
#   docker compose up --build --watch
# --watch 필수: Windows에서는 바인드 마운트로 파일 변경 이벤트가 컨테이너에
# 전달되지 않으므로, compose watch(sync)가 변경 파일을 컨테이너 안으로 복사해
# vite/devtools/uvicorn의 자동 반영을 동작시킨다.
# 운영 배포는 deploy/docker-compose.prod.yml + scripts/deploy.sh를 사용한다.
# ==========================================================================
name: itda-dev

services:
  web:
    build:
      context: ./apps/web
      target: build            # 빌더 스테이지에서 멈추고 vite dev 서버 실행
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    env_file:
      - path: .env            # 개인 변수 자동 주입 (없어도 기동 — .env.example 참고)
        required: false
    environment:
      VITE_PROXY_TARGET: http://backend:8080   # /api 요청을 backend 컨테이너로 프록시
    ports:
      - "127.0.0.1:5173:5173"
    develop:
      watch:
        - action: sync                          # 변경 파일을 컨테이너로 복사 → HMR
          path: ./apps/web/src
          target: /app/src
          initial_sync: true
        - action: sync
          path: ./apps/web/index.html
          target: /app/index.html
          initial_sync: true
        - action: rebuild                       # 의존성 변경은 이미지 재빌드
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/package-lock.json
    depends_on:
      - backend

  backend:
    build:
      context: ./apps/backend
      target: dev              # bootRun + devtools 자동 재시작 (운영 배포는 최종 스테이지)
    env_file:
      - path: .env            # 개인 변수 자동 주입 (없어도 기동 — .env.example 참고)
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}   # 기본 local(MariaDB db 서비스). RDS 사용 시 .env에서 변경 (.env.example)
      DB_HOST: db                              # 같은 네트워크의 MariaDB 컨테이너
      REDIS_HOST: redis                        # 같은 네트워크의 Redis 컨테이너
      AI_BASE_URL: http://ai:8000/api/v1       # AI는 내부 네트워크로 직접 호출
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - gradle-cache:/root/.gradle             # 의존성 캐시 (컨테이너 재생성 시 재다운로드 방지)
    develop:
      watch:
        - action: sync                          # src 복사 → build --continuous 재컴파일 → devtools 재시작
          path: ./apps/backend/src
          target: /workspace/src
          initial_sync: true
        - action: rebuild
          path: ./apps/backend/build.gradle
        - action: rebuild
          path: ./apps/backend/settings.gradle
    depends_on:
      ai:
        condition: service_started
      db:
        # 스키마 자동 반영(ddl-auto)이 기동 시 DB에 붙으므로 준비 완료를 기다린다
        condition: service_healthy
      redis:
        # RedisConnectionCheck가 기동 시 PING을 보내므로 준비 완료를 기다린다
        condition: service_healthy

  ai:
    build:
      context: ./apps/ai
      target: dev              # uvicorn --reload 자동 재시작 (운영 배포는 최종 스테이지)
    env_file:
      - path: .env            # 개인 변수 자동 주입 (없어도 기동 — .env.example 참고)
        required: false
    environment:
      ITDA_DEBUG: "true"
    ports:
      - "127.0.0.1:8000:8000"                  # 로컬 디버깅 편의용 (운영은 내부 전용)
    develop:
      watch:
        - action: sync                          # app 복사 → uvicorn --reload 재시작
          path: ./apps/ai/app
          target: /srv/app
          initial_sync: true
        - action: rebuild
          path: ./apps/ai/requirements.txt
        - action: rebuild
          path: ./apps/ai/requirements-dev.txt

  # 관계형 저장소 — 문서 기준 버전은 MariaDB 11.8.9 (11.8 LTS, docs/product/erd.md 7절)
  # 패치 버전까지 고정한다 — 같은 문서가 "고정 버전·이미지 digest 확인"을 요구한다.
  # digest: sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3
  db:
    image: mariadb:11.8.9
    env_file:
      # DB_PASSWORD는 기본값을 두지 않으므로 이 파일이 필요하다 (.env.example을 복사해 채운다).
      # 없으면 여기서 즉시 실패하게 해 backend가 placeholder 오류로 죽는 혼란을 막는다.
      - path: .env
        required: true
    environment:
      # 루트 비밀번호는 컨테이너가 매번 무작위로 만든다 — 저장소에 비밀값을 두지 않는다
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: ${DB_NAME:-itda}
      MARIADB_USER: ${DB_USERNAME:-itda}
      # 비밀번호에는 인라인 기본값을 두지 않는다 — 저장소에 자격증명을 남기지 않기 위해서다
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: UTC                                  # ERD 7절: 서버 영속 시각은 전부 UTC
    command:
      - --character-set-server=utf8mb4
      # 대소문자 무시 collation — users.username/email의 대소문자 비구분 중복 검사 근거 (ERD 3.1절)
      - --collation-server=utf8mb4_uca1400_ai_ci
      # 위 TZ만으로도 실질 UTC가 되지만(time_zone=SYSTEM → OS 시각), 그건 컨테이너 OS 설정에
      # 기대는 간접 보장이다. 서버 기본 시간대를 직접 고정해 UTC를 이미지·호스트와 무관하게 만든다
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:3306:3306"                  # 로컬 DB 클라이언트 접속용
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      # MariaDB 공식 이미지가 제공하는 스크립트
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # 인증 토큰 상태 저장소 — 문서 기준 버전은 Redis 8.2.9 (docs/product/erd.md 3.1.1·7절)
  # digest: sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
  redis:
    image: redis:8.2.9-alpine
    command:
      # 로컬은 영속화하지 않는다(RDB·AOF 모두 끔). 토큰 상태는 TTL로 만료되는 임시 데이터이고,
      # 재시작·복원으로 폐기된 토큰 상태가 되살아나는 문제는 ERD 3.1.1이 운영 승인 사항으로
      # 남겨 둔 미확정 계약이다 — 로컬에서 그 답을 먼저 정해 버리지 않는다
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:6379:6379"                  # 로컬 redis-cli 접속용
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  gradle-cache:
  mariadb-data:
