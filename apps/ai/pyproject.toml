# ruff(포맷·린트)와 pyright(타입체크) 설정 — docs/conventions/code-style-ai.md 참조
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# 기본 규칙 + import 정렬(I), 네이밍(N), 버그 유발 패턴(B)
extend-select = ["I", "N", "B"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
