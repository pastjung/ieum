plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.2'
}

group = 'com.itda'
version = '0.0.1-SNAPSHOT'
description = 'ITDA backend - braille learning support service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // web (Spring Boot 4.x: spring-boot-starter-web -> spring-boot-starter-webmvc)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'                      // test profile (오프라인 CI)
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'   // local·prod profile

    // 인증 토큰 상태 저장소 (docs/product/erd.md 3.1.1) — 관계형 토큰 테이블을 두지 않는다
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 비밀번호 해시 Argon2id (docs/product/feature-spec.md 2.1). starter-security가 아니라 crypto 모듈만 쓴다 —
    // 이 모듈에는 auto-configuration이 없어 인증 필터가 켜지지 않는다. 버전은 Boot BOM이 관리한다.
    implementation 'org.springframework.security:spring-security-crypto'
    // Argon2PasswordEncoder가 요구하는 저수준 구현. Boot BOM이 관리하지 않아 버전을 명시 고정한다.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'

    // Access Token 공통 인증 (docs/product/api-spec.md 3.6.1). SecurityFilterChain과 인증 경계만 쓴다.
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Access JWT 서명·검증. Boot BOM이 관리하지 않아 버전을 명시 고정한다.
    // tink는 EdDSA 경로 전용이라 HS256만 쓰는 이 서비스에서는 2.4MB를 그대로 얹을 이유가 없다.
    implementation('com.nimbusds:nimbus-jose-jwt:10.4') {
        exclude group: 'com.google.crypto.tink', module: 'tink'
    }

    // lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // dev: 클래스패스 변경 시 자동 재시작. developmentOnly라 bootJar(운영 이미지)에는 포함되지 않는다
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4부터 @DataJpaTest·TestEntityManager는 starter-test가 아니라 모듈별 test 아티팩트에 있다
    testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'

  annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
  annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
  annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
}

// 실제 MariaDB가 있어야만 의미가 있는 테스트에 붙이는 JUnit tag.
// 기본 test에서는 빼고 mariadbTest에서만 실행한다 — H2로 통과시키면 검증한 것이 없다.
ext.mariadbTestTag = 'mariadb'

// Access·Refresh·action 서명 key를 테스트 실행마다 새로 만든다. 저장소에 key 문자열을 남기지 않기 위해서다.
// doFirst에 두어 task 입력에 포함시키지 않는다 (매번 값이 바뀌어 up-to-date 판정이 무의미해지는 것을 피한다).
def applyTestSecrets = { Test task ->
    task.doFirst {
        def randomKey = {
            byte[] keyBytes = new byte[32]
            new java.security.SecureRandom().nextBytes(keyBytes)
            java.util.Base64.urlEncoder.withoutPadding().encodeToString(keyBytes)
        }
        task.systemProperty 'AUTH_JWT_ISSUER', 'itda-backend-test'
        task.systemProperty 'AUTH_ACCESS_ACTIVE_KID', 'test-active'
        task.systemProperty 'AUTH_ACCESS_ACTIVE_KEY', randomKey()
        // kid는 Access ring과 겹치면 안 된다 (RefreshTokenConfiguration의 교차 중복 검사)
        task.systemProperty 'AUTH_REFRESH_ACTIVE_KID', 'test-refresh-active'
        task.systemProperty 'AUTH_REFRESH_ACTIVE_KEY', randomKey()
        task.systemProperty 'AUTH_ACTION_ACTIVE_KID', 'test-action-active'
        task.systemProperty 'AUTH_ACTION_ACTIVE_KEY', randomKey()
        // 인증 상태 Redis 키 prefix. 테스트가 다른 환경의 키를 건드리지 못하게 test로 고정한다.
        task.systemProperty 'AUTH_REDIS_KEY_PREFIX', 'test'
    }
}

tasks.named('test') {
    useJUnitPlatform { excludeTags mariadbTestTag }
    applyTestSecrets(it)
}

// 실제 MariaDB 11.8.9에 대고 도는 테스트.
// Dockerfile의 mariadb-test 스테이지가 실행하며, 로컬에서는 같은 접속 정보의 MariaDB를 띄운 뒤 직접 실행한다.
//
// 접속 정보는 환경변수로만 받는다. 비밀번호에는 기본값을 두지 않으며 -D로 넘기지도 않는다.
// systemProperty는 forked JVM의 명령줄에 그대로 실리므로 ps 출력이나 크래시 덤프에 남을 수 있다.
tasks.register('mariadbTest', Test) {
    description = '실제 MariaDB가 필요한 통합 테스트만 실행한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags mariadbTestTag }
    applyTestSecrets(it)

    doFirst {
        def host = System.getenv('ITDA_TEST_DB_HOST') ?: '127.0.0.1'
        def port = System.getenv('ITDA_TEST_DB_PORT') ?: '3306'
        def name = System.getenv('ITDA_TEST_DB_NAME') ?: 'itda_test'
        def user = System.getenv('ITDA_TEST_DB_USER') ?: 'itda_test'
        def password = System.getenv('ITDA_TEST_DB_PASSWORD')
        if (!password) {
            throw new GradleException(
                    'ITDA_TEST_DB_PASSWORD 환경변수가 필요합니다. ' +
                            '비밀번호 기본값을 두지 않는 이유는 저장소와 명령 이력에 남기지 않기 위해서입니다.')
        }
        // test 프로필을 그대로 쓰고 datasource만 바꾼다. 프로필까지 바꾸면 검증 대상이 둘로 갈라진다.
        systemProperty 'spring.datasource.url',
                "jdbc:mariadb://${host}:${port}/${name}?connectionTimeZone=UTC"
        systemProperty 'spring.datasource.driver-class-name', 'org.mariadb.jdbc.Driver'
        systemProperty 'spring.datasource.username', user
        // 비밀번호만 환경변수로 넘긴다 (Spring Boot relaxed binding).
        environment 'SPRING_DATASOURCE_PASSWORD', password
    }
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat()
        removeUnusedImports()
    }
}
