plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.2'
}

group = 'com.itda'
version = '0.0.1-SNAPSHOT'
description = 'ITDA backend - braille learning support service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // web (Spring Boot 4.x: spring-boot-starter-web -> spring-boot-starter-webmvc)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'                      // test profile (오프라인 CI)
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'   // local·prod profile

    // 인증 토큰 상태 저장소 (docs/product/erd.md 3.1.1) — 관계형 토큰 테이블을 두지 않는다
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 비밀번호 해시 Argon2id (docs/product/feature-spec.md 2.1). starter-security가 아니라 crypto 모듈만 쓴다 —
    // 이 모듈에는 auto-configuration이 없어 인증 필터가 켜지지 않는다. 버전은 Boot BOM이 관리한다.
    implementation 'org.springframework.security:spring-security-crypto'
    // Argon2PasswordEncoder가 요구하는 저수준 구현. Boot BOM이 관리하지 않아 버전을 명시 고정한다.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'

    // lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // dev: 클래스패스 변경 시 자동 재시작. developmentOnly라 bootJar(운영 이미지)에는 포함되지 않는다
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4부터 @DataJpaTest·TestEntityManager는 starter-test가 아니라 모듈별 test 아티팩트에 있다
    testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat()
        removeUnusedImports()
    }
}
