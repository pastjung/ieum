spring:
  application:
    name: itda-backend
  profiles:
    default: local

server:
  port: 8080
  servlet:
    context-path: /api/v1

---
# ---------- local: H2 in-memory ----------
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:itda;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

---
# ---------- prod: MySQL ----------
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/itda?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:itda}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
