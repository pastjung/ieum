spring:
  application:
    name: itda-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # ERD 7절: 서버 영속 시각은 전부 UTC DATETIME(6)이다.
        jdbc.time_zone: UTC
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api/v1

---
# ---------- local: MariaDB (docker-compose의 db 서비스) ----------
# 컨테이너에서 실행하면 DB_HOST=db, 호스트에서 bootRun하면 기본값 localhost:3306을 쓴다.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:itda}?connectionTimeZone=UTC
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME:itda}
    # 기본값을 두지 않는다 — 미설정 시 기동 시점에 바로 드러나야 한다
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 스키마 원본은 엔티티다 (docs/superpowers/specs/2026-09-09-backend-ddd-entities-design.md 3.2절).
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true

---
# ---------- test: H2 (MySQL 모드) ----------
# Dockerfile의 test 스테이지는 DB 컨테이너·네트워크 없이 실행되므로 인메모리여야 한다.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:itda;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

---
# ---------- prod: MariaDB (RDS) ----------
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 운영에서는 스키마를 자동 변경하지 않고 엔티티와 일치하는지만 검증한다.
      ddl-auto: validate
